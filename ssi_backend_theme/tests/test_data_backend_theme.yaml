scenarios:
  - name: "Create Backend Theme with primary color"
    steps:
      - step: "Create theme with a valid primary color"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Ocean Blue"
          code: "THM001"
          color_primary: "#1A73E8"

      - step: "Assert theme created with expected defaults"
        action: "assert"
        target: "theme"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Ocean Blue"
          color_primary:
            type: "value"
            expected: "#1A73E8"
          active:
            type: "value"
            expected: true
          sidebar_default:
            type: "value"
            expected: "expanded"
          color_scheme_default:
            type: "value"
            expected: "light"

  - name: "Create Backend Theme with all extended color fields"
    steps:
      - step: "Create theme with text, background, status, and list view colors"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Full Palette Theme"
          code: "THM009"
          color_text_body: "#111111"
          color_view_background: "#eeeeee"
          color_success: "#0a8a3c"
          color_info: "#0a6a9a"
          color_warning: "#c98b02"
          color_danger: "#b52a37"
          color_list_header_bg: "#dcdcdc"
          color_list_row_hover_bg: "#f5f5f5"

      - step: "Assert every extended color field stored as-is"
        action: "assert"
        target: "theme"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          color_text_body:
            type: "value"
            expected: "#111111"
          color_view_background:
            type: "value"
            expected: "#eeeeee"
          color_success:
            type: "value"
            expected: "#0a8a3c"
          color_info:
            type: "value"
            expected: "#0a6a9a"
          color_warning:
            type: "value"
            expected: "#c98b02"
          color_danger:
            type: "value"
            expected: "#b52a37"
          color_list_header_bg:
            type: "value"
            expected: "#dcdcdc"
          color_list_row_hover_bg:
            type: "value"
            expected: "#f5f5f5"

  - name: "Create Backend Theme without any color field"
    steps:
      - step: "Create theme leaving all color fields empty"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "No Color Theme"
          code: "THM002"

      - step: "Assert theme created and color fields empty"
        action: "assert"
        target: "theme"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          color_primary:
            type: "value"
            operator: "is_falsy"
          color_navbar_bg:
            type: "value"
            operator: "is_falsy"
          color_navbar_text:
            type: "value"
            operator: "is_falsy"
          color_text_body:
            type: "value"
            operator: "is_falsy"
          color_view_background:
            type: "value"
            operator: "is_falsy"
          color_success:
            type: "value"
            operator: "is_falsy"
          color_info:
            type: "value"
            operator: "is_falsy"
          color_warning:
            type: "value"
            operator: "is_falsy"
          color_danger:
            type: "value"
            operator: "is_falsy"
          color_list_header_bg:
            type: "value"
            operator: "is_falsy"
          color_list_row_hover_bg:
            type: "value"
            operator: "is_falsy"

  - name: "Create Backend Theme without any sidebar visibility field"
    steps:
      - step: "Create theme leaving all sidebar visibility fields unset"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Full Sidebar Theme"
          code: "THM018"

      - step: "Assert every sidebar visibility field defaults to True"
        action: "assert"
        target: "theme"
        asserts:
          show_sidebar:
            type: "value"
            expected: true
          show_sidebar_logo:
            type: "value"
            expected: true
          show_sidebar_recent:
            type: "value"
            expected: true
          show_sidebar_bookmarks:
            type: "value"
            expected: true

  - name: "Edit Backend Theme name"
    steps:
      - step: "Create theme to edit"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Draft Name"
          code: "THM003"

      - step: "Write new name"
        action: "write"
        target: "theme"
        values:
          name: "Final Name"

      - step: "Assert name updated"
        action: "assert"
        target: "theme"
        asserts:
          name:
            type: "value"
            expected: "Final Name"

  - name: "Delete Backend Theme"
    steps:
      - step: "Create theme to be deleted"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "To Be Deleted"
          code: "THM004"

      - step: "Delete the theme"
        action: "unlink"
        target: "theme"

      - step: "Verify the theme is gone"
        action: "search"
        model: "backend_theme"
        domain: [["code", "=", "THM004"]]
        save_as: "result"
        expect_count: 0

  - name: "Generate Code from Sequence Template"
    steps:
      - step: "Create theme with placeholder code"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Auto Code Theme"
          code: "/"

      - step: "Call Generate Code button"
        action: "call"
        target: "theme"
        method: "action_generate_code"

      - step: "Assert code generated from the sequence template"
        action: "assert"
        target: "theme"
        asserts:
          code:
            type: "value"
            operator: "not_equals"
            expected: "/"

  - name: "Invalid hex color value is rejected"
    steps:
      - step: "Create theme with an invalid color value"
        action: "create"
        model: "backend_theme"
        expect_error:
          type: "ValidationError"
        values:
          name: "Broken Theme"
          code: "THM005"
          color_primary: "bukan-warna"

  - name: "Duplicate code is rejected"
    steps:
      - step: "Create first theme"
        action: "create"
        model: "backend_theme"
        save_as: "first"
        values:
          name: "First Theme"
          code: "THM006"

      - step: "Create second theme with the same code must fail"
        action: "create"
        model: "backend_theme"
        expect_error:
          type: "UserError"
        values:
          name: "Second Theme"
          code: "THM006"

  - name: "Invalid sidebar_default value is rejected"
    steps:
      - step: "Create theme with a sidebar_default outside the selection"
        action: "create"
        model: "backend_theme"
        expect_error:
          type: "ValueError"
        values:
          name: "Floating Theme"
          code: "THM007"
          sidebar_default: "melayang"

  - name: "Writing an invalid sidebar_default value is rejected and keeps the old value"
    steps:
      - step: "Create theme with a valid collapsed sidebar_default"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Sidebar Write Theme"
          code: "THM008"
          sidebar_default: "collapsed"

      - step: "Write a sidebar_default value outside the selection must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValueError"
        values:
          sidebar_default: "melayang"

      - step: "Assert the old sidebar_default value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          sidebar_default:
            type: "value"
            expected: "collapsed"

  - name: "Writing an invalid color_danger value is rejected and keeps the old value"
    steps:
      - step: "Create theme with a valid color_danger"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Danger Write Theme"
          code: "THM010"
          color_danger: "#dc3545"

      - step: "Write a non-hex color_danger value must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValidationError"
        values:
          color_danger: "merah"

      - step: "Assert the old color_danger value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          color_danger:
            type: "value"
            expected: "#dc3545"

  - name: "Create Backend Theme with a valid navbar_height"
    steps:
      - step: "Create theme with navbar_height in px"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Tall Navbar Theme"
          code: "THM012"
          navbar_height: "56px"

      - step: "Assert navbar_height stored as-is"
        action: "assert"
        target: "theme"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          navbar_height:
            type: "value"
            expected: "56px"

  - name: "Create Backend Theme with all navbar/spacing fields"
    steps:
      - step: "Create theme with every navbar/spacing field filled"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Roomy Navbar Theme"
          code: "THM013"
          navbar_height: "56px"
          navbar_font_size: "1.2rem"
          navbar_entry_padding_h: "1em"
          navbar_entry_margin_h: "4px"
          navbar_entry_border_radius: "4px"
          paragraph_spacing: "1.5rem"
          form_spacing: "8px"

      - step: "Assert every navbar/spacing field stored as-is"
        action: "assert"
        target: "theme"
        asserts:
          navbar_height:
            type: "value"
            expected: "56px"
          navbar_font_size:
            type: "value"
            expected: "1.2rem"
          navbar_entry_padding_h:
            type: "value"
            expected: "1em"
          navbar_entry_margin_h:
            type: "value"
            expected: "4px"
          navbar_entry_border_radius:
            type: "value"
            expected: "4px"
          paragraph_spacing:
            type: "value"
            expected: "1.5rem"
          form_spacing:
            type: "value"
            expected: "8px"

  - name: "Create Backend Theme without any navbar/spacing field"
    steps:
      - step: "Create theme leaving all navbar/spacing fields empty"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "No Navbar Setting Theme"
          code: "THM014"

      - step: "Assert every navbar/spacing field is empty"
        action: "assert"
        target: "theme"
        asserts:
          navbar_height:
            type: "value"
            operator: "is_falsy"
          navbar_font_size:
            type: "value"
            operator: "is_falsy"
          navbar_entry_padding_h:
            type: "value"
            operator: "is_falsy"
          navbar_entry_margin_h:
            type: "value"
            operator: "is_falsy"
          navbar_entry_border_radius:
            type: "value"
            operator: "is_falsy"
          paragraph_spacing:
            type: "value"
            operator: "is_falsy"
          form_spacing:
            type: "value"
            operator: "is_falsy"

  - name: "Writing a unitless navbar_height value is rejected and keeps the old value"
    steps:
      - step: "Create theme with a valid navbar_height"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Navbar Height Write Theme"
          code: "THM015"
          navbar_height: "56px"

      - step: "Write a unitless navbar_height value must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValidationError"
        values:
          navbar_height: "56"

      - step: "Assert the old navbar_height value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          navbar_height:
            type: "value"
            expected: "56px"

  - name: "Writing a non-numeric navbar_font_size value is rejected"
    steps:
      - step: "Create theme with a valid navbar_font_size"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Navbar Font Size Write Theme"
          code: "THM016"
          navbar_font_size: "1rem"

      - step: "Write a non-numeric navbar_font_size value must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValidationError"
        values:
          navbar_font_size: "besar"

      - step: "Assert the old navbar_font_size value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          navbar_font_size:
            type: "value"
            expected: "1rem"

  - name: "Writing a hex color value into navbar_height is rejected"
    steps:
      - step: "Create theme with a valid navbar_height"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Navbar Height Not A Color Theme"
          code: "THM017"
          navbar_height: "46px"

      - step: "Write a hex color value into navbar_height must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValidationError"
        values:
          navbar_height: "#ffffff"

      - step: "Assert the old navbar_height value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          navbar_height:
            type: "value"
            expected: "46px"

  - name: "Create Backend Theme without app_submenu_position uses default navbar"
    steps:
      - step: "Create theme without mentioning app_submenu_position"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Default Submenu Position Theme"
          code: "THM019"

      - step: "Assert app_submenu_position defaults to navbar"
        action: "assert"
        target: "theme"
        asserts:
          app_submenu_position:
            type: "value"
            expected: "navbar"

  - name:
      "Writing an invalid app_submenu_position value is rejected and keeps the old value"
    steps:
      - step: "Create theme with a valid popover app_submenu_position"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Submenu Position Write Theme"
          code: "THM020"
          app_submenu_position: "popover"

      - step: "Write an app_submenu_position value outside the selection must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValueError"
        values:
          app_submenu_position: "melayang"

      - step: "Assert the old app_submenu_position value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          app_submenu_position:
            type: "value"
            expected: "popover"

  - name:
      "Create Backend Theme without mentioning group_apps_by_category defaults to False"
    steps:
      - step: "Create theme without mentioning group_apps_by_category"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Flat Sidebar Theme"
          code: "THM021"

      - step: "Assert group_apps_by_category defaults to False"
        action: "assert"
        target: "theme"
        asserts:
          group_apps_by_category:
            type: "value"
            expected: false

  - name: "Create Backend Theme with group_apps_by_category enabled"
    steps:
      - step: "Create theme with group_apps_by_category set to True"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Grouped Sidebar Theme"
          code: "THM022"
          group_apps_by_category: true

      - step: "Assert group_apps_by_category stored as True"
        action: "assert"
        target: "theme"
        asserts:
          group_apps_by_category:
            type: "value"
            expected: true

  - name:
      "Create Backend Theme without mentioning chatter fields defaults to auto and
      toggle off"
    steps:
      - step: "Create theme without mentioning chatter_position/show_chatter_toggle"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Default Chatter Theme"
          code: "THM023"

      - step:
          "Assert chatter_position defaults to auto and show_chatter_toggle to False"
        action: "assert"
        target: "theme"
        asserts:
          chatter_position:
            type: "value"
            expected: "auto"
          show_chatter_toggle:
            type: "value"
            expected: false

  - name:
      "Writing an invalid chatter_position value is rejected and keeps the old value"
    steps:
      - step: "Create theme with a valid bottom chatter_position"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "Chatter Position Write Theme"
          code: "THM024"
          chatter_position: "bottom"

      - step: "Write a chatter_position value outside the selection must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValueError"
        values:
          chatter_position: "samping"

      - step: "Assert the old chatter_position value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          chatter_position:
            type: "value"
            expected: "bottom"

  - name: "Writing a wrong-length color_list_header_bg value is rejected"
    steps:
      - step: "Create theme with a valid color_list_header_bg"
        action: "create"
        model: "backend_theme"
        save_as: "theme"
        values:
          name: "List Header Write Theme"
          code: "THM011"
          color_list_header_bg: "#f8f9fa"

      - step: "Write a wrong-length color_list_header_bg value must fail"
        action: "write"
        target: "theme"
        expect_error:
          type: "ValidationError"
        values:
          color_list_header_bg: "#12345"

      - step: "Assert the old color_list_header_bg value is unchanged"
        action: "assert"
        target: "theme"
        asserts:
          color_list_header_bg:
            type: "value"
            expected: "#f8f9fa"
